<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marlon Carvalho · Nutrição Esportiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070B14;
    --ink-2:#0E1422;
    --surface:#111A2E;
    --line:rgba(255,255,255,.09);
    --navy:#3B6FE0;
    --navy-solid:#2B5BD7;
    --navy-deep:#16264A;
    --sand:#E8EDF6;
    --muted:#8C99B0;
    --radius:20px;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--sand);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:520px;
    margin:0 auto;
    padding:40px 20px 56px;
    position:relative;
  }
  .page::before{
    content:"";
    position:absolute;
    inset:0 0 auto;
    height:420px;
    background:radial-gradient(120% 100% at 50% 0%, rgba(59,111,224,.16) 0%, rgba(59,111,224,0) 62%);
    pointer-events:none;
  }

  /* ---------- HERO ---------- */
  .hero{position:relative;text-align:center}
  .portrait{
    width:132px;height:132px;
    margin:0 auto 22px;
    border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(160deg,var(--ink-2),#0a1020);
    border:1px solid var(--line);
    box-shadow:0 0 0 6px rgba(59,111,224,.08);
    overflow:hidden;
  }
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}
  .ph{
    font-size:11px;letter-spacing:.02em;color:var(--muted);
    text-align:center;line-height:1.35;padding:8px;
    border:1px dashed rgba(255,255,255,.22);border-radius:inherit;
    width:100%;height:100%;display:grid;place-items:center;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(34px,10vw,44px);
    line-height:1.05;
    letter-spacing:-.015em;
    margin:0 0 14px;
  }
  .roles{
    display:inline-flex;flex-wrap:wrap;justify-content:center;gap:10px;
    padding:9px 18px;
    border:1px solid var(--line);
    border-radius:999px;
    font-size:12.5px;font-weight:500;color:var(--sand);
    background:rgba(255,255,255,.02);
  }
  .roles span{color:var(--muted)}
  .bio{
    margin:20px auto 0;
    max-width:40ch;
    color:var(--muted);
    font-size:15px;
  }

  /* ---------- CARDS ---------- */
  .cards{
    margin-top:40px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .card{
    position:relative;
    display:flex;flex-direction:column;justify-content:flex-end;
    text-decoration:none;color:inherit;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px;
    overflow:hidden;
    transition:border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .card:hover{border-color:rgba(59,111,224,.45);transform:translateY(-2px)}
  .card:focus-visible{outline:2px solid var(--navy);outline-offset:3px}

  /* card principal ocupa a linha inteira */
  .card--lead{
    grid-column:1 / -1;
    min-height:216px;
    background:
      radial-gradient(100% 130% at 100% 0%, rgba(59,111,224,.22) 0%, rgba(59,111,224,0) 62%),
      linear-gradient(180deg,#17233F,#101829);
  }
  .card--sub{min-height:152px}

  .card-body{position:relative;z-index:2}

  .tag{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11.5px;font-weight:600;letter-spacing:.04em;
    color:var(--navy);margin-bottom:9px;
  }
  .tag::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:var(--navy);box-shadow:0 0 0 3px rgba(59,111,224,.18);
  }
  .card--lead h2{
    font-family:var(--serif);
    font-size:clamp(28px,8.5vw,34px);font-weight:600;
    line-height:1.05;letter-spacing:-.02em;margin:0;
    max-width:11ch;
  }
  .card--sub h2{
    font-size:19px;font-weight:600;line-height:1.2;
    letter-spacing:-.01em;margin:0;padding-right:36px;
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:18px;padding:11px 18px;border-radius:999px;
    font-size:14px;font-weight:600;
    border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--sand);
  }
  .btn--go{background:var(--navy-solid);border-color:var(--navy-solid);color:#F3F7FF}
  .btn svg{width:14px;height:14px;flex:none}

  /* seta discreta nos cards menores */
  .seta{
    position:absolute;right:18px;bottom:18px;z-index:2;
    width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;
    border:1px solid var(--line);
    color:var(--muted);
    transition:color .2s ease,border-color .2s ease,transform .2s ease;
  }
  .seta svg{width:12px;height:12px}
  .card--sub:hover .seta{color:var(--navy);border-color:rgba(59,111,224,.5);transform:translateX(2px)}

  /* marcas geométricas no lugar das fotos */
  .marca{
    position:absolute;z-index:1;pointer-events:none;
    color:var(--navy);
  }
  .marca--anel{
    right:-46px;top:-34px;width:210px;height:210px;opacity:.5;
  }
  .marca--anel circle{
    fill:none;stroke:currentColor;stroke-width:1.25;
  }
  .marca--ondas{
    right:-26px;top:6px;width:112px;height:112px;opacity:.28;
  }
  .marca--ondas path{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
  .marca--barras{
    right:16px;top:20px;width:74px;height:60px;opacity:.34;
  }
  .marca--barras rect{fill:currentColor}

  /* um único momento de movimento: o anel se desenha ao abrir */
  .marca--anel .traco{
    stroke-width:2;
    stroke-dasharray:var(--vol);
    stroke-dashoffset:var(--vol);
    animation:desenha 1.5s cubic-bezier(.2,.7,.3,1) .25s forwards;
  }
  @keyframes desenha{ to{ stroke-dashoffset:0 } }

  /* ---------- FOOTER ---------- */
  .links{
    margin-top:34px;
    display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
  }
  .links a{
    display:inline-flex;align-items:center;gap:8px;
    padding:12px 18px;border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.02);
    color:var(--sand);text-decoration:none;
    font-size:13.5px;font-weight:500;
  }
  .links a:hover{border-color:rgba(59,111,224,.4)}
  .links svg{width:15px;height:15px}
  .legal{
    margin-top:30px;text-align:center;
    font-size:11.5px;color:#5D6982;line-height:1.7;
  }
  .legal a{color:#5D6982}

  @media (max-width:400px){
    .card{padding:20px 17px}
    .card--sub{min-height:140px}
    .card--sub h2{font-size:17.5px}
    .btn{padding:10px 15px;font-size:13px;margin-top:16px}
    .cards{gap:12px}
  }
  @media (prefers-reduced-motion:reduce){
    .card,.seta{transition:none}
    .card:hover{transform:none}
    .marca--anel .traco{animation:none;stroke-dashoffset:0}
  }
</style>
</head>
